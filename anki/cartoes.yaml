  r: |
    self.tf_buffer = Buffer()
    self.tf_listener = TransformListener(self.tf_buffer, self)
  n: "O Buffer guarda ~10 s de transformações; o Listener se inscreve em /tf e /tf_static."

- id: tf-009
  deck: "11 - tf2"
  tipo: conceito
  p: "Consultar a transformação mais recente entre dois frames (com tratamento de erro)."
  r: |
    try:
        t = self.tf_buffer.lookup_transform(
            to_frame_rel,
            from_frame_rel,
            rclpy.time.Time())
    except TransformException as ex:
        self.get_logger().info(f'Could not transform: {ex}')
        return
  n: "rclpy.time.Time() vazio = 'a última disponível'."

- id: tf-010
  deck: "11 - tf2"
  tipo: conceito
  p: "Fórmula de controle usada para uma tartaruga perseguir a outra"
  r: |
    comando = ganho x erro

    msg.angular.z = 1.0 * atan2(t.transform.translation.y, t.transform.translation.x)
    msg.linear.x  = 0.5 * sqrt(x**2 + y**2)
  n: "Erro angular = ângulo até o alvo; erro linear = distância euclidiana."

- id: tf-011
  deck: "11 - tf2"
  tipo: conceito
  p: "Para que serve publicar transformações estáticas?"
  r: "Para descrever a relação fixa entre a base do robô e as partes que não se movem (sensores, por exemplo). Publica uma vez no /tf_static, com latch."
  n: ""
