# =====================================================================
#  Fonte única dos flashcards de ROS 2
# ---------------------------------------------------------------------
#  tipo: cmd      -> cartão com caixa de digitação (você digita o comando)
#  tipo: conceito -> cartão normal (pergunta/resposta, sem digitar)
#
#  Regra de ouro: 'cmd' só para respostas de UMA linha. A caixa de
#  digitação do Anki é single-line; bloco de código vai como 'conceito'.
#
#  id  -> identificador estável. NÃO mude depois de importar, senão o
#         Anki cria um cartão novo e você perde o histórico de revisão.
# =====================================================================

cartoes:

# ---------------------------------------------------------------------
# 01 - Ambiente e CLI
# ---------------------------------------------------------------------
- id: env-001
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Ativar (source) o ambiente ROS 2 Foxy no terminal atual"
  r: "source /opt/ros/foxy/setup.bash"
  n: "Precisa ser feito em TODO terminal novo. Isso é o *underlay*."

- id: env-002
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Fazer o source do Foxy automaticamente em todo terminal novo"
  r: "echo \"source /opt/ros/foxy/setup.bash\" >> ~/.bashrc"
  n: "Acrescenta a linha no fim do ~/.bashrc, que roda a cada shell interativo."

- id: env-003
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Conferir se as variáveis de ambiente do ROS estão setadas"
  r: "printenv | grep -i ROS"
  n: "Deve mostrar ROS_VERSION=2, ROS_PYTHON_VERSION=3, ROS_DISTRO=foxy."

- id: env-004
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Definir o domain ID como 42 na sessão atual"
  r: "export ROS_DOMAIN_ID=42"
  n: "Só nós com o MESMO domain ID se enxergam. Use 0–101 para ser seguro."

- id: env-005
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Limitar toda a comunicação ROS 2 ao localhost"
  r: "export ROS_LOCALHOST_ONLY=1"
  n: "Útil em sala de aula / rede compartilhada, para não invadir o grafo dos outros."

- id: env-006
  deck: "01 - Ambiente e CLI"
  tipo: conceito
  p: "Para que serve o ROS_DOMAIN_ID?"
  r: "Isola grupos de nós na mesma rede: só nós com o mesmo domain ID se descobrem e se comunicam."
  n: ""

- id: env-007
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Instalar o pacote turtlesim (Foxy)"
  r: "sudo apt install ros-foxy-turtlesim"
  n: ""

- id: env-008
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Listar os executáveis disponíveis dentro do pacote turtlesim"
  r: "ros2 pkg executables turtlesim"
  n: "Retorna turtlesim draw_square, turtlesim mimic, turtlesim turtle_teleop_key, turtlesim turtlesim_node."

- id: env-009
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Rodar o nó turtlesim_node do pacote turtlesim"
  r: "ros2 run turtlesim turtlesim_node"
  n: "Forma geral: ros2 run <pacote> <executável>"

- id: env-010
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Rodar o teleop de teclado do turtlesim"
  r: "ros2 run turtlesim turtle_teleop_key"
  n: ""

- id: env-011
  deck: "01 - Ambiente e CLI"
  tipo: cmd
  p: "Instalar o rqt e todos os seus plugins (Foxy)"
  r: "sudo apt install ~nros-foxy-rqt*"
  n: "O ~n é um padrão do apt (casa por NOME de pacote). Sem ele o glob não funciona."

- id: env-012
  deck: "01 - Ambiente e CLI"
  tipo: conceito
  p: "O que é o ROS graph?"
  r: "A rede de elementos ROS 2 processando dados ao mesmo tempo: nós, tópicos, serviços, actions e parâmetros, e as conexões entre eles."
  n: ""

# ---------------------------------------------------------------------
# 02 - Nodes e Tópicos
# ---------------------------------------------------------------------
- id: node-001
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Listar todos os nós rodando"
  r: "ros2 node list"
  n: ""

- id: node-002
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Ver publishers, subscribers, serviços e actions do nó /turtlesim"
  r: "ros2 node info /turtlesim"
  n: "A barra é obrigatória: o nome é totalmente qualificado."

- id: node-003
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Subir o turtlesim_node renomeando o nó para my_turtle"
  r: "ros2 run turtlesim turtlesim_node --ros-args --remap __node:=my_turtle"
  n: "Tudo que vem depois de --ros-args é argumento do ROS, não do executável."

- id: topic-001
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Listar os tópicos ativos"
  r: "ros2 topic list"
  n: ""

- id: topic-002
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Listar os tópicos ativos MOSTRANDO o tipo de mensagem de cada um"
  r: "ros2 topic list -t"
  n: "O tipo aparece entre colchetes: /turtle1/cmd_vel [geometry_msgs/msg/Twist]"

- id: topic-003
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Ver ao vivo os dados publicados em /turtle1/cmd_vel"
  r: "ros2 topic echo /turtle1/cmd_vel"
  n: "O echo cria um nó subscriber temporário — ele aparece no rqt_graph."

- id: topic-004
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Ver a estrutura interna da mensagem geometry_msgs/msg/Twist"
  r: "ros2 interface show geometry_msgs/msg/Twist"
  n: "ATENÇÃO: é geometry_msgs, com S. Retorna Vector3 linear / Vector3 angular."

- id: topic-005
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Ver quantos publishers e subscribers tem o tópico /turtle1/cmd_vel"
  r: "ros2 topic info /turtle1/cmd_vel"
  n: ""

- id: topic-006
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Qual flag do 'ros2 topic pub' publica UMA mensagem e encerra?"
  r: "--once"
  n: "ros2 topic pub --once /turtle1/cmd_vel geometry_msgs/msg/Twist \"{...}\""

- id: topic-007
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Qual flag do 'ros2 topic pub' publica continuamente a 1 Hz?"
  r: "-r 1"
  n: "Sem --once nem -r, o pub repete numa taxa padrão."

- id: topic-008
  deck: "02 - Nodes e Tópicos"
  tipo: conceito
  p: "Escreva o comando completo para mandar a tartaruga andar e girar uma única vez."
  r: |
    ros2 topic pub --once /turtle1/cmd_vel geometry_msgs/msg/Twist \
      "{linear: {x: 2.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 1.8}}"
  n: "Os argumentos vão em YAML, entre aspas."

- id: topic-009
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Medir a taxa (Hz) com que /turtle1/pose está sendo publicado"
  r: "ros2 topic hz /turtle1/pose"
  n: "Retorna average rate, min, max, std dev e window."

- id: topic-010
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Medir a largura de banda consumida por /turtle1/pose"
  r: "ros2 topic bw /turtle1/pose"
  n: ""

- id: topic-011
  deck: "02 - Nodes e Tópicos"
  tipo: cmd
  p: "Abrir a ferramenta gráfica que desenha o grafo de nós e tópicos"
  r: "rqt_graph"
  n: ""

- id: topic-012
  deck: "02 - Nodes e Tópicos"
  tipo: conceito
  p: "No rqt_graph, o que significa uma seta saindo do círculo (nó) para a caixa (tópico)?"
  r: "O nó está PUBLICANDO no tópico. Seta da caixa para o círculo = o nó está inscrito (subscriber)."
  n: ""

- id: topic-013
  deck: "02 - Nodes e Tópicos"
  tipo: conceito
  p: "Diferença essencial entre tópico e serviço"
  r: "Tópico é publish/subscribe contínuo e anônimo (muitos para muitos, sem resposta). Serviço é request/response pontual: só devolve dado quando alguém pede."
  n: ""

- id: topic-014
  deck: "02 - Nodes e Tópicos"
  tipo: conceito
  p: "Um nó deve ser responsável por quantas coisas?"
  r: "Uma só — propósito único e modular (ex.: controlar as rodas, ou publicar o dado de um sensor). O sistema completo é a soma de vários nós."
  n: ""

# ---------------------------------------------------------------------
# 03 - Serviços e Parâmetros
# ---------------------------------------------------------------------
- id: srv-001
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Listar todos os serviços ativos"
  r: "ros2 service list"
  n: ""

- id: srv-002
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Listar os serviços ativos mostrando o tipo de cada um"
  r: "ros2 service list -t"
  n: ""

- id: srv-003
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Descobrir o tipo do serviço /clear"
  r: "ros2 service type /clear"
  n: "Retorna std_srvs/srv/Empty."

- id: srv-004
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Achar todos os serviços do tipo std_srvs/srv/Empty"
  r: "ros2 service find std_srvs/srv/Empty"
  n: "Retorna /clear e /reset."

- id: srv-005
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Ver os argumentos de request e response do serviço /spawn"
  r: "ros2 interface show turtlesim/srv/Spawn"
  n: "É .srv, não .src. No Foxy o comando aceita o tipo sem extensão."

- id: srv-006
  deck: "03 - Serviços e Parâmetros"
  tipo: conceito
  p: "Num arquivo .srv, o que separa o request da response?"
  r: "Três hífens: ---   (acima = request, abaixo = response)"
  n: "No .action são DOIS separadores: goal --- result --- feedback."

- id: srv-007
  deck: "03 - Serviços e Parâmetros"
  tipo: conceito
  p: "Escreva o comando que cria uma tartaruga chamada 'jorge' em (6,6)."
  r: |
    ros2 service call /spawn turtlesim/srv/Spawn \
      "{x: 6.0, y: 6.0, theta: 1.0, name: 'jorge'}"
  n: "Forma geral: ros2 service call <serviço> <tipo> <argumentos em YAML>"

- id: par-001
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Listar os parâmetros de todos os nós"
  r: "ros2 param list"
  n: ""

- id: par-002
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Ler o valor atual do parâmetro background_g do nó /turtlesim"
  r: "ros2 param get /turtlesim background_g"
  n: ""

- id: par-003
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Mudar em tempo de execução o background_r do /turtlesim para 150"
  r: "ros2 param set /turtlesim background_r 150"
  n: "Responde 'Set parameter successful'. O efeito some ao reiniciar o nó."

- id: par-004
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Salvar todos os parâmetros do /turtlesim num arquivo YAML"
  r: "ros2 param dump /turtlesim"
  n: "Gera ./turtlesim.yaml no diretório atual."

- id: par-005
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Carregar ./turtlesim.yaml num nó /turtlesim que JÁ está rodando"
  r: "ros2 param load /turtlesim ./turtlesim.yaml"
  n: ""

- id: par-006
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Subir o turtlesim_node já carregando o arquivo ./turtlesim.yaml"
  r: "ros2 run turtlesim turtlesim_node --ros-args --params-file ./turtlesim.yaml"
  n: "Diferença para o 'param load': aqui os valores valem desde a inicialização."

- id: par-007
  deck: "03 - Serviços e Parâmetros"
  tipo: cmd
  p: "Ver tipo e descrição do parâmetro my_parameter do nó /minimal_param_node"
  r: "ros2 param describe /minimal_param_node my_parameter"
  n: "A descrição vem do ParameterDescriptor declarado no código."

- id: par-008
  deck: "03 - Serviços e Parâmetros"
  tipo: conceito
  p: "Que tipos um parâmetro pode ter?"
  r: "integer, float (double), boolean, string e listas desses tipos."
  n: "Pense em parâmetro como 'a configuração de um nó'."

# ---------------------------------------------------------------------
# 04 - Actions (CLI)
# ---------------------------------------------------------------------
- id: act-001
  deck: "04 - Actions (CLI)"
  tipo: cmd
  p: "Listar todas as actions do grafo"
  r: "ros2 action list"
  n: ""

- id: act-002
  deck: "04 - Actions (CLI)"
  tipo: cmd
  p: "Listar as actions mostrando o tipo"
  r: "ros2 action list -t"
  n: "/turtle1/rotate_absolute [turtlesim/action/RotateAbsolute]"

- id: act-003
  deck: "04 - Actions (CLI)"
  tipo: cmd
  p: "Ver quem é cliente e quem é servidor da action /turtle1/rotate_absolute"
  r: "ros2 action info /turtle1/rotate_absolute"
  n: ""

- id: act-004
  deck: "04 - Actions (CLI)"
  tipo: cmd
  p: "Ver a estrutura (goal/result/feedback) do tipo RotateAbsolute"
  r: "ros2 interface show turtlesim/action/RotateAbsolute"
  n: "theta --- delta --- remaining"

- id: act-005
  deck: "04 - Actions (CLI)"
  tipo: conceito
  p: "Escreva o comando que manda a tartaruga girar para theta = 1.57."
  r: |
    ros2 action send_goal /turtle1/rotate_absolute \
      turtlesim/action/RotateAbsolute "{theta: 1.57}"
  n: "Forma geral: ros2 action send_goal <action> <tipo> <valores YAML>"

- id: act-006
  deck: "04 - Actions (CLI)"
  tipo: cmd
  p: "Qual flag acrescentada ao send_goal mostra o feedback contínuo?"
  r: "--feedback"
  n: "Sem ela você só vê o goal ID e o result final."

- id: act-007
  deck: "04 - Actions (CLI)"
  tipo: conceito
  p: "Quais são as três partes de uma action?"
  r: "Goal (o pedido), Feedback (progresso periódico) e Result (o resultado final)."
  n: ""

- id: act-008
  deck: "04 - Actions (CLI)"
  tipo: conceito
  p: "Action é construída em cima de quê, e para que serve?"
  r: "Em cima de serviços (goal e result, request/response assíncrono) + tópico (feedback). Serve para tarefas longas, que dão progresso e podem ser canceladas."
  n: ""

- id: act-009
  deck: "04 - Actions (CLI)"
  tipo: conceito
  p: "Qual a ordem dos três blocos num arquivo .action?"
  r: |
    # Goal (request)
    ---
    # Result
    ---
    # Feedback
  n: "Dois separadores '---', três blocos."

# ---------------------------------------------------------------------
# 05 - Bag, rqt_console e logs
# ---------------------------------------------------------------------
- id: bag-001
  deck: "05 - Bag, rqt_console e logs"
  tipo: cmd
  p: "Abrir a ferramenta gráfica de visualização de logs"
  r: "ros2 run rqt_console rqt_console"
  n: "Permite filtrar por nível de severidade e salvar/recarregar mensagens."

- id: bag-002
  deck: "05 - Bag, rqt_console e logs"
  tipo: cmd
  p: "Gravar os dados publicados em /turtle1/cmd_vel"
  r: "ros2 bag record /turtle1/cmd_vel"
  n: "Ctrl+C encerra. O ros2 bag só grava o que passa por TÓPICO."

- id: bag-003
  deck: "05 - Bag, rqt_console e logs"
  tipo: cmd
  p: "Gravar cmd_vel e pose num diretório chamado 'subset'"
  r: "ros2 bag record -o subset /turtle1/cmd_vel /turtle1/pose"
  n: "-o define o nome do diretório; os tópicos vão em lista."

- id: bag-004
  deck: "05 - Bag, rqt_console e logs"
  tipo: cmd
  p: "Ver duração, tamanho, tópicos e contagem de mensagens da bag 'subset'"
  r: "ros2 bag info subset"
  n: "O campo Count explica por que o play demora mais que o movimento."

- id: bag-005
  deck: "05 - Bag, rqt_console e logs"
  tipo: cmd
  p: "Reproduzir a bag 'subset'"
  r: "ros2 bag play subset"
  n: "Feche o teleop antes, senão os dois disputam o cmd_vel."

- id: bag-006
  deck: "05 - Bag, rqt_console e logs"
  tipo: conceito
  p: "Sem -o, qual o nome do diretório gerado pelo ros2 bag record?"
  r: "rosbag2_ano_mes_dia-hora_minuto_segundo"
  n: "Dentro dele: um .db3 (sqlite3) e um metadata.yaml."

# ---------------------------------------------------------------------
# 06 - Workspace, colcon e pacotes
# ---------------------------------------------------------------------
- id: ws-001
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Criar a estrutura inicial de um workspace chamado ros2_ws"
  r: "mkdir -p ~/ros2_ws/src"
  n: "Todo pacote vai dentro de src/."

- id: ws-002
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Compilar o workspace inteiro (da raiz)"
  r: "colcon build"
  n: "Gera build/, install/ e log/ ao lado de src/."

- id: ws-003
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Compilar SÓ o pacote my_package"
  r: "colcon build --packages-select my_package"
  n: "PEGADINHA: é --packages-select (plural + select), não --package-selected."

- id: ws-004
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Compilar my_package E todas as dependências dele (mas não o workspace todo)"
  r: "colcon build --packages-up-to my_package"
  n: "PEGADINHA: --packages-up-to, plural."

- id: ws-005
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Compilar de forma que editar um script Python não exija recompilar"
  r: "colcon build --symlink-install"
  n: "Cria links simbólicos em vez de copiar os arquivos para install/."

- id: ws-006
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Compilar mostrando a saída do compilador direto no console"
  r: "colcon build --event-handlers console_direct+"
  n: "Sem isso a saída fica escondida em log/."

- id: ws-007
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Checar dependências faltando antes do build (da raiz do workspace, Foxy)"
  r: "rosdep install -i --from-path src --rosdistro foxy -y"
  n: "Boa prática antes de todo colcon build."

- id: ws-008
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Rodar os testes do workspace"
  r: "colcon test"
  n: ""

- id: ws-009
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Fazer o source do overlay (o seu workspace), da raiz dele"
  r: "source install/local_setup.bash"
  n: ""

- id: ws-010
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "Diferença entre install/setup.bash e install/local_setup.bash"
  r: "local_setup.bash expõe só os pacotes DESTE workspace. setup.bash expõe este workspace mais os underlays que ele herdou (é o atalho do dia a dia)."
  n: ""

- id: ws-011
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "O que são underlay e overlay?"
  r: "Underlay = workspace base cujo source você faz primeiro (normalmente a distro, /opt/ros/foxy). Overlay = o seu workspace por cima. Toda dependência do overlay precisa existir no underlay."
  n: "O overlay tem precedência: um turtlesim modificado no seu ws vence o da distro."

- id: ws-012
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "Quais os 4 diretórios da raiz de um workspace depois do build?"
  r: "build/ (arquivos intermediários), install/ (onde cada pacote é instalado), log/ (logs de cada invocação do colcon) e src/ (código-fonte)."
  n: ""

- id: pkg-001
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Criar um pacote Python chamado my_package (de dentro de src/)"
  r: "ros2 pkg create --build-type ament_python my_package"
  n: ""

- id: pkg-002
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Criar o pacote my_package já com um executável my_node de exemplo"
  r: "ros2 pkg create --build-type ament_python --node-name my_node my_package"
  n: ""

- id: pkg-003
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Criar o pacote py_srvcli já declarando as dependências rclpy e example_interfaces"
  r: "ros2 pkg create --build-type ament_python py_srvcli --dependencies rclpy example_interfaces"
  n: "Com --dependencies você não precisa editar o package.xml na mão."

- id: pkg-004
  deck: "06 - Workspace, colcon e pacotes"
  tipo: cmd
  p: "Criar um pacote CMake chamado tutorial_interfaces"
  r: "ros2 pkg create --build-type ament_cmake tutorial_interfaces"
  n: "Interfaces (.msg/.srv/.action) SÓ podem ser geradas em pacote ament_cmake."

- id: pkg-005
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "Qual o conteúdo mínimo de um pacote ROS 2 em Python?"
  r: |
    my_package/
      package.xml            # meta-informação
      resource/my_package    # arquivo marcador
      setup.cfg
      setup.py               # entry_points, data_files
      my_package/            # mesmo nome do pacote, com __init__.py
  n: ""

- id: pkg-006
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "Como registrar o executável 'talker' apontando para publisher_member_function.py?"
  r: |
    entry_points={
        'console_scripts': [
            'talker = py_pubsub.publisher_member_function:main',
        ],
    },
  n: "Padrão: 'nome_executavel = nome_pacote.nome_modulo:main'. Vai no setup.py."

- id: pkg-007
  deck: "06 - Workspace, colcon e pacotes"
  tipo: conceito
  p: "Como declarar no package.xml que o pacote usa rclpy e std_msgs em tempo de execução?"
  r: |
    <exec_depend>rclpy</exec_depend>
    <exec_depend>std_msgs</exec_depend>
  n: ""

# ---------------------------------------------------------------------
# 07 - rclpy: pub/sub e service/client
# ---------------------------------------------------------------------
- id: py-001
  deck: "07 - rclpy: pub/sub e service/client"
  tipo: conceito
  p: "Escreva de memória o main() padrão de um nó ROS 2 em Python."
  r: |
    def main(args=None):
        rclpy.init(args=args)
        node = MinhaClasse()
        rclpy.spin(node)
        node.destroy_node()
        rclpy.shutdown()

    if __name__ == '__main__':
        main()
  n: "Pipeline: init -> cria nó -> spin (processa callbacks) -> shutdown."

