site_name: Livro de Robótica
site_description: Anotações de estudo em robótica - da matemática ao ROS 2

theme:
  name: material
  language: pt-BR
  palette:
    primary: black
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # ---- acrescentado para o capítulo de ROS 2 ----
  - attr_list                  # necessário para os "grid cards" do index
  - md_in_html                 # idem
  - pymdownx.emoji:            # o ícone :material-keyboard: da página de flashcards
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início: index.md

  - Introdução: 01-introducao/index.md

  - Fundamentos:
      - Visão geral: 02-fundamentos/index.md
      - Cálculo: 02-fundamentos/01-calculo/index.md
      - Álgebra Linear: 02-fundamentos/02-algebra-linear/index.md
      - Circuitos Elétricos: 02-fundamentos/03-circuitos-eletricos/index.md
      - Eletrônica: 02-fundamentos/04-eletronica/index.md
      - Eletrônica Prática: 02-fundamentos/05-eletronica-pratica/index.md

  - Robótica Aplicada (Software):
      - Visão geral: 03-robotica-aplicada/index.md
      - ROS 2:
          - Visão geral: 03-robotica-aplicada/01-ros2/index.md
