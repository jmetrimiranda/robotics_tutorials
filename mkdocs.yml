          - Workspace e pacotes: 03-robotica-aplicada/01-ros2/02-workspace-e-pacotes.md
          - Publisher/Subscriber e Serviços: 03-robotica-aplicada/01-ros2/03-pub-sub-e-servicos.md
          - Actions: 03-robotica-aplicada/01-ros2/04-actions.md
          - Launch Files:
              - Criando um launch file: 03-robotica-aplicada/01-ros2/05-launch-criando.md
              - Integrando em pacotes ROS 2: 03-robotica-aplicada/01-ros2/06-launch-em-pacotes.md
              - Usando Substituições: 03-robotica-aplicada/01-ros2/07-launch-substituicoes.md
              - Usando Event Handlers: 03-robotica-aplicada/01-ros2/08-launch-event-handlers.md
              - Gerenciando grandes projetos: 03-robotica-aplicada/01-ros2/09-launch-projetos-grandes.md
